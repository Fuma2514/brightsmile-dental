<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrightSmile Dental — AI Appointment Assistant</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f9fc;color:#123a4c}
.hero{padding:48px 24px;text-align:center;background:linear-gradient(160deg,#0e6ba8,#3ba7d9)}
h1{margin:0;font-size:2rem;color:#fff}.sub{color:#dff2fb;margin-top:8px}
.chatbox{max-width:520px;margin:32px auto;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(14,107,168,.25);overflow:hidden}
.hd{padding:14px 18px;background:#0e6ba8;color:#fff;font-weight:bold}
#log{height:320px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:10px 14px;border-radius:12px;line-height:1.4}
.bot{background:#e6f4fb;align-self:flex-start}.usr{background:#0e6ba8;color:#fff;align-self:flex-end}
form{display:flex;border-top:1px solid #e6f4fb}input{flex:1;padding:14px;border:0;outline:0;color:#123a4c}
button{padding:14px 20px;background:#0e6ba8;border:0;color:#fff;font-weight:bold;cursor:pointer}
.ft{max-width:520px;margin:0 auto 40px;text-align:center;opacity:.7;font-size:.85rem;padding:0 16px}
</style></head><body>
<div class="hero"><h1>BrightSmile Dental</h1><div class="sub">Appointments &amp; FAQs — answered instantly by AI, 24/7</div></div>
<div class="chatbox"><div class="hd">AI Assistant — ask anything</div><div id="log"></div>
<form id="f"><input id="i" placeholder="Book a cleaning this Friday morning?" autocomplete="off"><button>Send</button></form></div>
<div class="ft">Demo assistant built by Fuma Agent · live in under 24h for any dental clinic</div>
<script>
const log=document.getElementById('log');
function add(t,who){const d=document.createElement('div');d.className='m '+who;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
add("Hello! I can book an appointment or answer questions about our services. What can I do for you?","bot");
const DB={hours:"We're open Mon–Fri 9:00–18:00 and Sat 9:00–13:00. Closed Sundays.",price:"Cleaning from $80, white filling from $120, whitening from $350, consultation $50 (waived if you proceed with treatment).",emergency:"For severe pain or a broken tooth, call our emergency line and we'll fit you in the same day if possible.",insurance:"We accept most major dental insurance plans and offer a 10% discount for uninsured patients on check-ups.",location:"We're at 42 Maple Avenue, 2nd floor — free parking behind the building."};
let stage=0,service=null,date=null;
function reply(q){const l=q.toLowerCase();
for(const k in DB){if(l.includes(k))return DB[k]}
if(l.includes('appointment')||l.includes('book')||l.includes('clean')||l.includes('check')||l.includes('whiten')||l.includes('dentist')){stage=1;return "Happy to book! Which service do you need — cleaning, check-up, filling, or whitening?"}
if(stage==1){service=q.trim();stage=2;return service+" — great choice. Which day and time work for you?"}
if(stage==2){date=q.trim();stage=3;return service+" on "+date+" — noted. What name should I put the appointment under?"}
if(stage==3){return "Thank you, "+q.trim()+"! Your request for "+service+" on "+date+" is logged. A member of our front desk will confirm shortly. (All demo data is fictional.)"}
return "I can help with appointments, opening hours, prices, insurance, or emergencies. Try \"book an appointment\"!";}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const i=document.getElementById('i');const q=i.value.trim();if(!q)return;add(q,'usr');i.value='';setTimeout(()=>add(reply(q),'bot'),400)};
</script></body></html>
